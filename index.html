<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="Explore the cars, engineering and culture that made Japanese performance an obsession. A curated JDM archive by team letsgo."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="./media/initiald-first-2ecbf9dc4fb2.webp"
      media="(prefers-reduced-motion: no-preference)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./media/initiald-last-d46ce5ee4e22.webp"
      media="(prefers-reduced-motion: reduce)"
      fetchpriority="high"
    />
    <title>JDM Legends — Legends. In motion.</title>
    <script>
      (() => {
        let theme = "dark";
        try {
          if (JSON.parse(localStorage.getItem("jdm:theme")) === "light")
            theme = "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0b0b0c" : "#f6f6f2";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
